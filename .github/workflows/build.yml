
name: Build Sovchilar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            python3-pip python3-venv \
            python3-setuptools \
            build-essential \
            libffi-dev libssl-dev \
            zlib1g-dev

      - name: Install Buildozer
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.36" buildozer
          python -m pip show Cython
          .venv/bin/cython --version

      - name: Build APK
        run: |
          .venv/bin/buildozer -v android debug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: sovchilar-apk
          path: bin/*.apk
          if-no-files-found: error
          
          
